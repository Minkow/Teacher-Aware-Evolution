[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-aware-evolution"
version = "0.1.0"
description = "Teacher-aware evolution of executable optimization heuristics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1", "joblib>=1.3", "requests>=2.31", "tqdm>=4.65", "PyYAML>=6", "networkx>=3", "pandas>=2", "tomli>=2"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tae*"]
namespaces = true


